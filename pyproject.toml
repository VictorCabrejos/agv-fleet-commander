[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agv-fleet-commander"
version = "0.2.0"
description = "Educational AGV fleet orchestration simulator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
runtime = [
  "fastapi>=0.104,<1",
  "openai>=2,<3",
  "pandas>=2,<3",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.24,<1",
]
dev = [
  "httpx>=0.25,<1",
  "pytest>=7.4,<9",
  "pytest-asyncio>=0.21,<1",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
py-modules = ["config", "main"]

[tool.setuptools.packages.find]
include = ["adapters*", "domain*"]

[tool.ruff]
target-version = "py310"
